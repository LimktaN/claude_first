<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>니코틴이 필요해!</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --border: #333;
      --text: #ffffff;
      --muted: #b0b0b0;
      --accent: #ff8a3d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 32px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
    }

    #timer {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: clamp(2.6rem, 12vw, 4rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    #count {
      font-size: 1.2rem;
      color: var(--muted);
    }

    #count strong { color: var(--text); }

    .buttons {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    button {
      flex: 0 1 auto;
      min-width: 0;
      padding: 10px 16px;
      border: 1px solid rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: filter 0.15s ease;
    }

    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(1px); filter: brightness(0.95); }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    #btn-smoke {
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 55%, #1d4ed8 100%);
      color: #ffffff;
    }

    #btn-undo {
      background: linear-gradient(180deg, #f87171 0%, #dc2626 55%, #b91c1c 100%);
      color: #ffffff;
    }

    #btn-empty {
      background: linear-gradient(180deg, #d9f99d 0%, #a3e635 55%, #84cc16 100%);
      color: #1a2e05;
    }

    #ashtray {
      width: min(300px, 80vw);
      height: auto;
      display: block;
    }

    #log {
      list-style: none;
      margin: 0;
      padding: 8px 12px;
      width: 100%;
      /* 10줄까지 보이고, 넘치면 박스 안에서 스크롤 */
      --line: 1.6em;
      line-height: var(--line);
      height: calc(var(--line) * 10 + 16px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
    }

    #log li {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #log li:first-child { font-weight: 700; }
    #log .smoke { color: #6ee7b7; }
    #log .undo { color: #d1d5db; }
    #log .undo-fail { color: #f87171; }
    #log .empty { color: #bef264; }
  </style>
</head>
<body>
  <main>
    <h1>니코틴이 필요해!</h1>
    <div id="timer">00:00:00</div>
    <div id="count">흡연한 담배 수: <strong id="count-num">0</strong></div>

    <div class="buttons">
      <button id="btn-smoke" type="button">흡연 완료</button>
      <button id="btn-undo" type="button">흡연 철회</button>
      <button id="btn-empty" type="button">재떨이 비우기</button>
    </div>

    <svg id="ashtray" viewBox="0 0 300 300" role="img" aria-label="재떨이">
      <defs>
        <radialGradient id="bowl" cx="50%" cy="45%" r="60%">
          <stop offset="0%" stop-color="#4a4f57"/>
          <stop offset="100%" stop-color="#2a2d32"/>
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9aa3ad"/>
          <stop offset="100%" stop-color="#5b626b"/>
        </linearGradient>
      </defs>
      <!-- 테두리 -->
      <circle cx="150" cy="150" r="140" fill="url(#rim)"/>
      <!-- 담배 거치 홈 -->
      <g fill="#3a3f46">
        <rect x="138" y="6" width="24" height="30" rx="10"/>
        <rect x="138" y="264" width="24" height="30" rx="10"/>
        <rect x="6" y="138" width="30" height="24" rx="10"/>
        <rect x="264" y="138" width="30" height="24" rx="10"/>
      </g>
      <!-- 바닥 -->
      <circle cx="150" cy="150" r="112" fill="url(#bowl)"/>
      <circle cx="150" cy="150" r="112" fill="none" stroke="#1d2024" stroke-width="3"/>
      <g id="butts"></g>
    </svg>

    <ul id="log" aria-label="기록" aria-live="polite"></ul>
  </main>

  <script>
    const STORAGE_KEY = 'nicotine-timer-v1';

    const timerEl = document.getElementById('timer');
    const countEl = document.getElementById('count-num');
    const buttsEl = document.getElementById('butts');
    const logEl = document.getElementById('log');

    // smokes: 흡연할 때마다 { elapsed: 리셋 직전 타이머(ms), x, y, angle }
    // logs: { type: 'smoke' | 'undo' | 'undo-fail' | 'empty', text }
    let state = load() || { startTime: Date.now(), smokes: [], logs: [] };

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && typeof saved.startTime === 'number' && Array.isArray(saved.smokes) && Array.isArray(saved.logs)) {
          saved.logs = saved.logs.map((log) => (typeof log === 'string' ? { type: guessLogType(log), text: log } : log));
          return saved;
        }
      } catch (e) {}
      return null;
    }

    // 종류 없이 문자열로만 저장된 예전 기록의 종류를 문구로 판별
    function guessLogType(text) {
      if (text.endsWith('철회할 담배가 없습니다.') || text === '아직 흡연한 적이 없습니다') return 'undo-fail';
      if (text.includes('철회했습니다')) return 'undo';
      if (text.endsWith('재떨이를 비웠습니다.')) return 'empty';
      return 'smoke';
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    const pad = (n) => String(n).padStart(2, '0');

    function formatDuration(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function nowClock() {
      const d = new Date();
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function renderTimer() {
      timerEl.textContent = formatDuration(Date.now() - state.startTime);
    }

    function renderCount() {
      countEl.textContent = state.smokes.length;
    }

    function renderButts() {
      const ns = 'http://www.w3.org/2000/svg';
      buttsEl.replaceChildren();
      for (const { x, y, angle } of state.smokes) {
        const g = document.createElementNS(ns, 'g');
        g.setAttribute('transform', `translate(${x} ${y}) rotate(${angle})`);
        g.innerHTML = `
          <rect x="-36" y="-7.5" width="72" height="15" rx="3" fill="#000" opacity="0.25" transform="translate(3 4)"/>
          <rect x="-36" y="-7.5" width="30" height="15" rx="3" fill="#d98c3f"/>
          <rect x="-6" y="-7.5" width="36" height="15" fill="#f2efe8"/>
          <rect x="27" y="-7.5" width="9" height="15" rx="3" fill="#555"/>
          <circle cx="-24" cy="-2" r="1.5" fill="#b56d2a"/>
          <circle cx="-15" cy="3" r="1.5" fill="#b56d2a"/>`;
        buttsEl.appendChild(g);
      }
    }

    function renderLog() {
      logEl.replaceChildren(...state.logs.map(({ type, text }) => {
        const li = document.createElement('li');
        li.className = type;
        li.textContent = text;
        li.title = text;
        return li;
      }));
    }

    function addLog(type, text) {
      state.logs.unshift({ type, text }); // 최신 문구가 맨 위
      renderLog();
      logEl.scrollTop = 0;
    }

    function randomButt() {
      // 재떨이 바닥(반지름 112) 안쪽에 꽁초가 들어가도록 배치
      const r = Math.sqrt(Math.random()) * 60;
      const t = Math.random() * Math.PI * 2;
      return {
        x: Math.round(150 + r * Math.cos(t)),
        y: Math.round(150 + r * Math.sin(t)),
        angle: Math.round(Math.random() * 360),
      };
    }

    document.getElementById('btn-smoke').addEventListener('click', () => {
      const now = Date.now();
      const elapsed = now - state.startTime;
      state.smokes.push({ elapsed, ...randomButt() });
      state.startTime = now;
      addLog('smoke', `${nowClock()}에 ${formatDuration(elapsed)}만에 담배를 피웠습니다.`);
      renderCount();
      renderButts();
      renderTimer();
      save();
    });

    document.getElementById('btn-undo').addEventListener('click', () => {
      if (state.smokes.length === 0) {
        addLog('undo-fail', '흡연한 적이 없어 철회할 담배가 없습니다.');
        save();
        return;
      }
      const last = state.smokes.pop();
      // 기억해둔 이전 타이머 + 현재 타이머
      state.startTime -= last.elapsed;
      addLog('undo', `${nowClock()}에 흡연한 담배 기록을 철회했습니다.`);
      renderCount();
      renderButts();
      renderTimer();
      save();
    });

    document.getElementById('btn-empty').addEventListener('click', () => {
      state.smokes = [];
      addLog('empty', `${nowClock()} 재떨이를 비웠습니다.`);
      renderCount();
      renderButts();
      save();
    });

    renderTimer();
    renderCount();
    renderButts();
    renderLog();
    save();
    setInterval(renderTimer, 250);
  </script>
</body>
</html>
